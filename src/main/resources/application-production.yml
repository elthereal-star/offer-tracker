spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

offer-tracker:
  auth:
    jwt-secret: ${JWT_SECRET}
    required: ${AUTH_REQUIRED:true}
    config-encryption-key: ${AI_CONFIG_ENCRYPTION_KEY}
  storage:
    type: ${RESUME_STORAGE_TYPE:s3}
    s3:
      endpoint: ${S3_ENDPOINT}
      region: ${S3_REGION}
      bucket: ${S3_BUCKET}
      prefix: ${S3_PREFIX:offer-tracker/resumes}
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}
