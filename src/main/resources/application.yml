server:
  port: 8080

spring:
  application:
    name: offer-tracker
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/offer-tracker
    username: sa
    password: ""
  sql:
    init:
      mode: never
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    validate-migration-naming: true
  h2:
    console:
      enabled: true
      path: /h2-console

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-cookie: false
  is-read-header: true
  is-read-body: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    redis:
      enabled: false
    mongo:
      enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 枚举按名称字符串存库，避免依赖 MyBatis-Plus 的 IEnum 约定
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    banner: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

offer-tracker:
  ai:
    connect-timeout: ${AI_CONNECT_TIMEOUT:10s}
    request-timeout: ${AI_REQUEST_TIMEOUT:90s}
    requests-per-minute: ${AI_REQUESTS_PER_MINUTE:10}
  auth:
    required: ${AUTH_REQUIRED:false}
    config-encryption-key: ${AI_CONFIG_ENCRYPTION_KEY:local-development-only-ai-config-key-change-for-production}
  storage:
    type: ${RESUME_STORAGE_TYPE:local}
    resume-dir: ${RESUME_STORAGE_DIR:./data/resumes}
    ai-config-file: ${AI_CONFIG_FILE:./data/ai-config.json}
