server:
  port: 8080

spring:
  application:
    name: offer-tracker
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/offer-tracker
    username: sa
    password: ""
  sql:
    init:
      mode: never
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    validate-migration-naming: true
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 枚举按名称字符串存库，避免依赖 MyBatis-Plus 的 IEnum 约定
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    banner: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

offer-tracker:
  auth:
    jwt-secret: ${JWT_SECRET}
    required: ${AUTH_REQUIRED:false}
    config-encryption-key: ${AI_CONFIG_ENCRYPTION_KEY:${JWT_SECRET}}
  storage:
    resume-dir: ${RESUME_STORAGE_DIR:./data/resumes}
    ai-config-file: ${AI_CONFIG_FILE:./data/ai-config.json}
